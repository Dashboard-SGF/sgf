name: Deploy SGF to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do Código
        uses: actions/checkout@v4

      - name: 2. Setup do Ambiente PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, sqlite3, pdo_sqlite, bcmath, gd

      - name: 3. Instalar Dependências do Composer
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: 4. Configurar Ambiente Laravel & Banco SQLite Zerado
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate

      - name: 5. Rodar Migrations & Popular Banco via Seeder
        run: php artisan migrate:fresh --seed --force

      - name: 6. Executar Exportação Estática (Spatie)
        env:
          APP_ENV: production
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: php artisan export

      - name: 7. Pós-Processamento Físico de URLs (Limpeza de Localhost)
        run: |
          find dist -type f -name "*.html" -exec sed -i 's|http://localhost/|/|g' {} +
          find dist -type f -name "*.html" -exec sed -i 's|http://localhost||g' {} +

      - name: 8. Upload do Artefato para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: 9. Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
